<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="t d">
<title id="t">Del objetivo a la evidencia</title><desc id="d">El objetivo fija qué se evaluará, el procedimiento explica cómo se medirá y la evidencia identifica qué se registrará. El ejemplo conecta el error de posicionamiento con pruebas repetidas y registros de consignas, lecturas y errores.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1060" height="360" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="34" y="52" font-size="30" font-weight="700" fill="#0f172a">Del objetivo a la evidencia</text>
<text x="34" y="84" font-size="19" fill="#334155">Una forma de comprobar la coherencia de la metodología</text>
<g transform="translate(34 115)">
<rect width="304" height="158" rx="15" fill="#fff" stroke="#64748b"/>
<text x="18" y="34" font-size="18" font-weight="700" fill="#115e59">Objetivo</text>
<text x="18" y="79" font-size="21" font-weight="700" fill="#0f172a">¿Qué se evaluará?</text>
<text x="18" y="122" font-size="16" fill="#334155">Error de posicionamiento</text>
</g>
<g transform="translate(378 115)">
<rect width="304" height="158" rx="15" fill="#fff" stroke="#64748b"/>
<text x="18" y="34" font-size="18" font-weight="700" fill="#115e59">Procedimiento</text>
<text x="18" y="79" font-size="21" font-weight="700" fill="#0f172a">¿Cómo se medirá?</text>
<text x="18" y="122" font-size="16" fill="#334155">Repetir y medir posiciones</text>
</g>
<g transform="translate(722 115)">
<rect width="304" height="158" rx="15" fill="#fff" stroke="#64748b"/>
<text x="18" y="34" font-size="18" font-weight="700" fill="#115e59">Evidencia</text>
<text x="18" y="79" font-size="21" font-weight="700" fill="#0f172a">¿Qué se registrará?</text>
<text x="18" y="122" font-size="16" fill="#334155">Consignas, lecturas y errores</text>
</g>
<path d="M343 194H371" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M687 194H715" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="34" y="295" width="992" height="43" rx="10" fill="#eff6ff"/>
<text x="49" y="323" font-size="18" fill="#1e40af">Definan las condiciones de ensayo y el criterio antes de interpretar los resultados.</text>
</g></svg>
