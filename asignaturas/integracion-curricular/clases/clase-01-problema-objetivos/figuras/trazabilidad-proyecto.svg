<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="725" viewBox="0 0 1060 725" role="img" aria-labelledby="title desc"><title id="title">Del problema a una evidencia verificable</title><desc id="desc">Dos ejemplos para revisar la coherencia entre necesidades y evaluación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#115e59"/></marker></defs><rect width="1060" height="725" fill="#f8fafc"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="15" fill="#115e59" font-weight="600">INTEGRACIÓN CURRICULAR / CLASE 01</text><text x="40" y="94" font-size="30" fill="#0f172a" font-weight="600">Del problema a una evidencia verificable</text><text x="40" y="132" font-size="18" fill="#334155" font-weight="400">Dos ejemplos para revisar la coherencia entre necesidades y evaluación.</text><text x="40" y="192" font-size="19" fill="#115e59" font-weight="600">NECESIDAD</text><text x="380" y="192" font-size="19" fill="#115e59" font-weight="600">RESULTADO BUSCADO</text><text x="720" y="192" font-size="19" fill="#115e59" font-weight="600">EVIDENCIA</text><rect x="40" y="220" width="300" height="130" rx="16" fill="white" stroke="#64748b"/><rect x="40" y="220" width="300" height="6" rx="3" fill="#115e59"/><text x="58" y="258" font-size="22" fill="#0f172a" font-weight="600">Capacidad sin medir</text><text x="58" y="298" font-size="18" fill="#334155" font-weight="400">Se desconoce cuánto</text><text x="58" y="324" font-size="18" fill="#334155" font-weight="400">procesa el sistema</text><rect x="380" y="220" width="300" height="130" rx="16" fill="white" stroke="#64748b"/><rect x="380" y="220" width="300" height="6" rx="3" fill="#115e59"/><text x="398" y="258" font-size="22" fill="#0f172a" font-weight="600">Medir capacidad</text><text x="398" y="298" font-size="18" fill="#334155" font-weight="400">Definir condiciones</text><text x="398" y="324" font-size="18" fill="#334155" font-weight="400">e indicador en kg/h</text><rect x="720" y="220" width="300" height="130" rx="16" fill="white" stroke="#64748b"/><rect x="720" y="220" width="300" height="6" rx="3" fill="#115e59"/><text x="738" y="258" font-size="22" fill="#0f172a" font-weight="600">Ensayo registrado</text><text x="738" y="298" font-size="18" fill="#334155" font-weight="400">Masa procesada</text><text x="738" y="324" font-size="18" fill="#334155" font-weight="400">y duración</text><path d="M340 285 L372 285" stroke="#115e59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M680 285 L712 285" stroke="#115e59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="395" width="300" height="130" rx="16" fill="white" stroke="#64748b"/><rect x="40" y="395" width="300" height="6" rx="3" fill="#115e59"/><text x="58" y="433" font-size="22" fill="#0f172a" font-weight="600">Agua sin cuantificar</text><text x="58" y="473" font-size="18" fill="#334155" font-weight="400">Se desconoce el consumo</text><text x="58" y="499" font-size="18" fill="#334155" font-weight="400">por cantidad de producto</text><rect x="380" y="395" width="300" height="130" rx="16" fill="white" stroke="#64748b"/><rect x="380" y="395" width="300" height="6" rx="3" fill="#115e59"/><text x="398" y="433" font-size="22" fill="#0f172a" font-weight="600">Evaluar consumo</text><text x="398" y="473" font-size="18" fill="#334155" font-weight="400">Definir el indicador</text><text x="398" y="499" font-size="18" fill="#334155" font-weight="400">específico en L/kg</text><rect x="720" y="395" width="300" height="130" rx="16" fill="white" stroke="#64748b"/><rect x="720" y="395" width="300" height="6" rx="3" fill="#115e59"/><text x="738" y="433" font-size="22" fill="#0f172a" font-weight="600">Medición comparable</text><text x="738" y="473" font-size="18" fill="#334155" font-weight="400">Volumen de agua</text><text x="738" y="499" font-size="18" fill="#334155" font-weight="400">y masa procesada</text><path d="M340 460 L372 460" stroke="#115e59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M680 460 L712 460" stroke="#115e59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="570" width="980" height="115" rx="16" fill="#0f172a"/><text x="62" y="610" font-size="21" fill="#5eead4" font-weight="600">ALINEACIÓN DEL PROYECTO</text><text x="62" y="651" font-size="22" fill="white" font-weight="400">Cada objetivo necesita un resultado y una forma de comprobarlo.</text></g></svg>