<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="730" viewBox="0 0 1060 730" role="img" aria-labelledby="title desc"><title id="title">Indicadores para evaluar un proceso</title><desc id="desc">Relacionar cada medición con una pregunta del proyecto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#115e59"/></marker></defs><rect width="1060" height="730" fill="#f8fafc"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="15" fill="#115e59" font-weight="600">INTEGRACIÓN CURRICULAR / CLASE 01</text><text x="40" y="94" font-size="30" fill="#0f172a" font-weight="600">Indicadores para evaluar un proceso</text><text x="40" y="132" font-size="18" fill="#334155" font-weight="400">Relacionar cada medición con una pregunta del proyecto.</text><rect x="40" y="185" width="470" height="350" rx="16" fill="white" stroke="#64748b"/><rect x="550" y="185" width="470" height="350" rx="16" fill="white" stroke="#64748b"/><text x="62" y="229" font-size="22" fill="#115e59" font-weight="600">CAPACIDAD DE PROCESO</text><text x="572" y="229" font-size="22" fill="#1e40af" font-weight="600">CONSUMO ESPECÍFICO</text><text x="62" y="284" font-size="21" fill="#334155" font-weight="400">Masa procesada · m [kg]</text><text x="62" y="328" font-size="21" fill="#334155" font-weight="400">Duración del ensayo · t [h]</text><path d="M275 355 L275 393" stroke="#115e59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="150" y="441" font-size="30" fill="#0f172a" font-weight="600">C = m / t</text><text x="122" y="490" font-size="22" fill="#334155" font-weight="400">Resultado en kg/h</text><text x="572" y="284" font-size="21" fill="#334155" font-weight="400">Volumen utilizado · V [L]</text><text x="572" y="328" font-size="21" fill="#334155" font-weight="400">Masa procesada · m [kg]</text><path d="M785 355 L785 393" stroke="#115e59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="660" y="441" font-size="30" fill="#0f172a" font-weight="600">w = V / m</text><text x="641" y="490" font-size="22" fill="#334155" font-weight="400">Resultado en L/kg</text><rect x="40" y="580" width="980" height="110" rx="16" fill="#0f172a"/><text x="62" y="622" font-size="21" fill="#5eead4" font-weight="600">COMPARACIÓN ENTRE CONDICIONES</text><text x="62" y="661" font-size="22" fill="white" font-weight="400">Definir el mismo alcance de medición y comprobar los demás requisitos.</text></g></svg>