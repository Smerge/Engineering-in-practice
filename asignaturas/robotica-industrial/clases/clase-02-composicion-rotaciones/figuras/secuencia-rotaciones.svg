<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" role="img" aria-labelledby="t d">
<title id="t">Giros sobre ejes fijos</title><desc id="d">Primero se aplica Rx de 30 grados, después Rz de 45 grados y al final Ry de 60 grados. En el producto, Rx está junto al vector inicial a la derecha.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1060" height="360" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="34" y="52" font-size="30" font-weight="700" fill="#0f172a">Giros sobre ejes fijos</text>
<text x="34" y="84" font-size="19" fill="#334155">Aplicar las matrices desde la derecha</text>
<g transform="translate(34 115)">
<rect width="304" height="158" rx="15" fill="#fff" stroke="#64748b"/>
<text x="18" y="34" font-size="18" font-weight="700" fill="#115e59">Primer giro</text>
<text x="18" y="79" font-size="21" font-weight="700" fill="#0f172a">X · +30°</text>
<text x="18" y="122" font-size="16" fill="#334155">Actúa sobre p</text>
</g>
<g transform="translate(378 115)">
<rect width="304" height="158" rx="15" fill="#fff" stroke="#64748b"/>
<text x="18" y="34" font-size="18" font-weight="700" fill="#115e59">Segundo giro</text>
<text x="18" y="79" font-size="21" font-weight="700" fill="#0f172a">Z · +45°</text>
<text x="18" y="122" font-size="16" fill="#334155">Actúa sobre el primer resultado</text>
</g>
<g transform="translate(722 115)">
<rect width="304" height="158" rx="15" fill="#fff" stroke="#64748b"/>
<text x="18" y="34" font-size="18" font-weight="700" fill="#115e59">Tercer giro</text>
<text x="18" y="79" font-size="21" font-weight="700" fill="#0f172a">Y · +60°</text>
<text x="18" y="122" font-size="16" fill="#334155">Entrega el vector final</text>
</g>
<path d="M343 194H371" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<path d="M687 194H715" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="34" y="295" width="992" height="43" rx="10" fill="#eff6ff"/>
<text x="49" y="323" font-size="18" fill="#1e40af">Producto sobre el vector: Ry(60°) · Rz(45°) · Rx(30°) · p</text>
</g></svg>
