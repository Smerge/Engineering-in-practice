<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="690" viewBox="0 0 1060 690" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Lectura de curvas de compresión</title>
<desc id="descripcion">Cuatro paneles cualitativos con escalas independientes. El metal fluye y endurece, la roca frágil muestra un pico y una caída, la madera cambia según la dirección de la fibra y el polímero dúctil muestra una curva de ejemplo.</desc>
<rect width="1060" height="690" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="34" y="46" font-size="30" font-weight="700" fill="#0f172a">Lectura de curvas de compresión</text>
<text x="34" y="77" font-size="19" fill="#334155">Esquemas cualitativos · Ejes independientes y magnitudes positivas</text>
<g transform="translate(34 98)">
<rect width="490" height="264" rx="15" fill="#fff" stroke="#64748b"/>
