<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="720" viewBox="0 0 1060 720" role="img" aria-labelledby="title desc"><title id="title">Tres formas de describir el movimiento</title><desc id="desc">La elección depende de qué se observa y de si el cuerpo cambia de forma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#115e59"/></marker></defs><rect width="1060" height="720" fill="#f8fafc"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="15" fill="#115e59" font-weight="600">BIOMECÁNICA / CLASE 01</text><text x="40" y="94" font-size="30" fill="#0f172a" font-weight="600">Tres formas de describir el movimiento</text><text x="40" y="132" font-size="18" fill="#334155" font-weight="400">La elección depende de qué se observa y de si el cuerpo cambia de forma.</text><rect x="40" y="185" width="300" height="245" rx="16" fill="white" stroke="#64748b"/><rect x="40" y="185" width="300" height="6" rx="3" fill="#115e59"/><text x="58" y="228" font-size="23" fill="#0f172a" font-weight="600">Trayectoria</text><text x="58" y="283" font-size="18" fill="#334155" font-weight="400">Un punto en el tiempo</text><text x="58" y="326" font-size="18" fill="#334155" font-weight="400">Posición r(t)</text><text x="58" y="369" font-size="18" fill="#334155" font-weight="400">Derivadas temporales</text><path d="M190 430 V475" stroke="#115e59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="485" width="300" height="100" rx="16" fill="#0f172a"/><text x="58" y="540" font-size="19" fill="white" font-weight="600">Velocidad y aceleración</text><rect x="380" y="185" width="300" height="245" rx="16" fill="white" stroke="#64748b"/><rect x="380" y="185" width="300" height="6" rx="3" fill="#1e40af"/><text x="398" y="228" font-size="23" fill="#0f172a" font-weight="600">Movimiento rígido</text><text x="398" y="283" font-size="18" fill="#334155" font-weight="400">Un segmento y sus marcos</text><text x="398" y="326" font-size="18" fill="#334155" font-weight="400">Rotación y traslación</text><text x="398" y="369" font-size="18" fill="#334155" font-weight="400">Transformación T</text><path d="M530 430 V475" stroke="#115e59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="380" y="485" width="300" height="100" rx="16" fill="#0f172a"/><text x="398" y="540" font-size="19" fill="white" font-weight="600">Posición y orientación</text><rect x="720" y="185" width="300" height="245" rx="16" fill="white" stroke="#64748b"/><rect x="720" y="185" width="300" height="6" rx="3" fill="#115e59"/><text x="738" y="228" font-size="23" fill="#0f172a" font-weight="600">Deformación</text><text x="738" y="283" font-size="18" fill="#334155" font-weight="400">Puntos de un material</text><text x="738" y="326" font-size="18" fill="#334155" font-weight="400">Referencia X y posición x</text><text x="738" y="369" font-size="18" fill="#334155" font-weight="400">Gradiente F</text><path d="M870 430 V475" stroke="#115e59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="720" y="485" width="300" height="100" rx="16" fill="#0f172a"/><text x="738" y="540" font-size="19" fill="white" font-weight="600">Deformación y volumen</text><text x="40" y="640" font-size="22" fill="#0f172a" font-weight="600">Una matriz jacobiana contiene derivadas parciales.</text><text x="40" y="679" font-size="21" fill="#334155" font-weight="400">Su determinante, cuando existe, es una cantidad diferente de la matriz.</text></g></svg>