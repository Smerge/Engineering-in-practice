<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="570" viewBox="0 0 1060 570" role="img" aria-labelledby="t d">
<title id="t">Perfil escalonado y coordenadas</title><desc id="d">Seis segmentos unen P0 en cero cero con P1 treinta cero, P2 treinta quince, P3 quince quince, P4 quince veinticinco, P5 cero veinticinco y vuelven a P0. Todas las coordenadas están en milímetros.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#1e40af"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#115e59"/></marker></defs>
<rect width="1060" height="570" fill="#f8fafc"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="34" y="49" font-size="30" font-weight="700" fill="#0f172a">Una trayectoria, dos formas de programarla</text>
<text x="34" y="82" font-size="19" fill="#334155">Ejemplo didáctico · Plano XY · Coordenadas en milímetros</text>
<rect x="34" y="105" width="570" height="393" rx="15" fill="#fff" stroke="#64748b"/>
<rect x="625" y="105" width="401" height="393" rx="15" fill="#fff" stroke="#64748b"/>
<path d="M145 400H554" stroke="#1e40af" stroke-width="2" marker-end="url(#a)"/>
<path d="M145 400V112" stroke="#115e59" stroke-width="2" marker-end="url(#b)"/>
<text x="557" y="417" font-size="21" font-weight="700" fill="#1e40af">X</text><text x="119" y="125" font-size="21" font-weight="700" fill="#115e59">Y</text>
<path d="M145 400H475V235H310V125H145Z" fill="#fff1f2" stroke="#9f1239" stroke-width="4"/>
<circle cx="145" cy="400" r="5" fill="#9f1239"/><text x="153" y="424" font-size="19" font-weight="700" fill="#0f172a">P0</text>
<circle cx="475" cy="400" r="5" fill="#9f1239"/><text x="486" y="400" font-size="19" font-weight="700" fill="#0f172a">P1</text>
<circle cx="475" cy="235" r="5" fill="#9f1239"/><text x="486" y="229" font-size="19" font-weight="700" fill="#0f172a">P2</text>
<circle cx="310" cy="235" r="5" fill="#9f1239"/><text x="321" y="257" font-size="19" font-weight="700" fill="#0f172a">P3</text>
<circle cx="310" cy="125" r="5" fill="#9f1239"/><text x="321" y="148" font-size="19" font-weight="700" fill="#0f172a">P4</text>
<circle cx="145" cy="125" r="5" fill="#9f1239"/><text x="153" y="151" font-size="19" font-weight="700" fill="#0f172a">P5</text>
<text x="254" y="470" font-size="19" fill="#334155">Ancho total · 30 mm</text>
<text x="648" y="146" font-size="23" font-weight="700" fill="#0f172a">Del punto P3 al punto P4</text>
<text x="648" y="194" font-size="19" fill="#334155">P3 = (15, 15)</text>
<text x="648" y="228" font-size="19" fill="#334155">P4 = (15, 25)</text>
<text x="648" y="292" font-size="22" font-weight="700" fill="#115e59">G90 → Y25</text>
<text x="648" y="325" font-size="18" fill="#334155">Coordenada del destino</text>
<text x="648" y="386" font-size="22" font-weight="700" fill="#1e40af">G91 → Y10</text>
<text x="648" y="419" font-size="18" fill="#334155">Desplazamiento desde P3</text>
<text x="34" y="539" font-size="19" fill="#334155">Ambos programas parten de P0 y recorren los puntos en el mismo orden a Z = 10 mm.</text>
</g></svg>