<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="705" viewBox="0 0 1060 705" role="img" aria-labelledby="title desc"><title id="title">Del modelo CAD a la pieza fabricada</title><desc id="desc">Un recorrido de mecanizado dentro de un sistema de información integrado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#115e59"/></marker></defs><rect width="1060" height="705" fill="#f8fafc"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="15" fill="#115e59" font-weight="600">INTEGRACIÓN CAD CAM CIM / CLASE 01</text><text x="40" y="94" font-size="30" fill="#0f172a" font-weight="600">Del modelo CAD a la pieza fabricada</text><text x="40" y="132" font-size="18" fill="#334155" font-weight="400">Un recorrido de mecanizado dentro de un sistema de información integrado.</text><rect x="40" y="180" width="300" height="125" rx="16" fill="white" stroke="#64748b"/><rect x="40" y="180" width="300" height="6" rx="3" fill="#115e59"/><text x="60" y="218" font-size="22" fill="#0f172a" font-weight="600">1 · Diseño CAD</text><text x="60" y="256" font-size="18" fill="#334155" font-weight="400">Geometría, dimensiones</text><text x="60" y="282" font-size="18" fill="#334155" font-weight="400">y requisitos de la pieza</text><rect x="380" y="180" width="300" height="125" rx="16" fill="white" stroke="#64748b"/><rect x="380" y="180" width="300" height="6" rx="3" fill="#115e59"/><text x="400" y="218" font-size="22" fill="#0f172a" font-weight="600">2 · Planificación CAM</text><text x="400" y="256" font-size="18" fill="#334155" font-weight="400">Operaciones, herramientas</text><text x="400" y="282" font-size="18" fill="#334155" font-weight="400">y trayectorias</text><rect x="720" y="180" width="300" height="125" rx="16" fill="white" stroke="#64748b"/><rect x="720" y="180" width="300" height="6" rx="3" fill="#115e59"/><text x="740" y="218" font-size="22" fill="#0f172a" font-weight="600">3 · Posprocesado</text><text x="740" y="256" font-size="18" fill="#334155" font-weight="400">Conversión a programa NC</text><text x="740" y="282" font-size="18" fill="#334155" font-weight="400">para máquina y control</text><path d="M340 242 L375 242" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M680 242 L715 242" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M870 305 L870 355" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="720" y="360" width="300" height="125" rx="16" fill="white" stroke="#64748b"/><rect x="720" y="360" width="300" height="6" rx="3" fill="#115e59"/><text x="740" y="398" font-size="22" fill="#0f172a" font-weight="600">4 · Verificación</text><text x="740" y="436" font-size="18" fill="#334155" font-weight="400">Programa, simulación</text><text x="740" y="462" font-size="18" fill="#334155" font-weight="400">y condiciones del montaje</text><rect x="380" y="360" width="300" height="125" rx="16" fill="white" stroke="#64748b"/><rect x="380" y="360" width="300" height="6" rx="3" fill="#115e59"/><text x="400" y="398" font-size="22" fill="#0f172a" font-weight="600">5 · Mecanizado CNC</text><text x="400" y="436" font-size="18" fill="#334155" font-weight="400">Ejecución validada</text><text x="400" y="462" font-size="18" fill="#334155" font-weight="400">de las operaciones</text><rect x="40" y="360" width="300" height="125" rx="16" fill="white" stroke="#64748b"/><rect x="40" y="360" width="300" height="6" rx="3" fill="#115e59"/><text x="60" y="398" font-size="22" fill="#0f172a" font-weight="600">6 · Inspección</text><text x="60" y="436" font-size="18" fill="#334155" font-weight="400">Comprobación de la pieza</text><text x="60" y="462" font-size="18" fill="#334155" font-weight="400">frente a sus requisitos</text><path d="M720 422 L685 422" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M380 422 L345 422" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="530" width="980" height="135" rx="16" fill="#0f172a"/><text x="62" y="569" font-size="22" fill="#5eead4" font-weight="600">CIM · INTEGRACIÓN DE INFORMACIÓN</text><text x="62" y="607" font-size="21" fill="white" font-weight="400">Planificación, producción, calidad y trazabilidad conectadas.</text></g></svg>