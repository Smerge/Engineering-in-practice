<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="850" viewBox="0 0 1060 850" role="img" aria-labelledby="title desc"><title id="title">Articulaciones: dos criterios de clasificación</title><desc id="desc">La estructura y la movilidad describen aspectos diferentes de una misma unión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="1060" height="850" fill="#f8fafc"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="15" fill="#0f766e" font-weight="600">BIOMECATRÓNICA / CLASE 01</text><text x="40" y="94" font-size="30" fill="#0f172a" font-weight="600">Articulaciones: dos criterios de clasificación</text><text x="40" y="130" font-size="18" fill="#334155" font-weight="400">La estructura y la movilidad describen aspectos diferentes de una misma unión.</text><rect x="40" y="174" width="470" height="445" rx="18" fill="#eff6ff"/><rect x="550" y="174" width="470" height="445" rx="18" fill="#f0fdfa"/><text x="62" y="214" font-size="19" fill="#1d4ed8" font-weight="600">CLASIFICACIÓN ESTRUCTURAL</text><text x="62" y="247" font-size="18" fill="#334155" font-weight="400">¿Cómo se unen las estructuras?</text><text x="572" y="214" font-size="19" fill="#0f766e" font-weight="600">CLASIFICACIÓN FUNCIONAL</text><text x="572" y="247" font-size="18" fill="#334155" font-weight="400">¿Cuánta movilidad permiten?</text><rect x="62" y="270" width="426" height="100" rx="16" fill="white" stroke="#cbd5e1"/><rect x="62" y="270" width="426" height="6" rx="3" fill="#2563eb"/><text x="84" y="310" font-size="23" fill="#0f172a" font-weight="600">Fibrosas</text><text x="84" y="347" font-size="18" fill="#334155" font-weight="400">Unión por tejido conectivo fibroso.</text><rect x="62" y="385" width="426" height="100" rx="16" fill="white" stroke="#cbd5e1"/><rect x="62" y="385" width="426" height="6" rx="3" fill="#2563eb"/><text x="84" y="425" font-size="23" fill="#0f172a" font-weight="600">Cartilaginosas</text><text x="84" y="462" font-size="18" fill="#334155" font-weight="400">Unión mediante cartílago.</text><rect x="62" y="500" width="426" height="100" rx="16" fill="white" stroke="#cbd5e1"/><rect x="62" y="500" width="426" height="6" rx="3" fill="#2563eb"/><text x="84" y="540" font-size="23" fill="#0f172a" font-weight="600">Sinoviales</text><text x="84" y="577" font-size="18" fill="#334155" font-weight="400">Cavidad articular con líquido sinovial.</text><rect x="572" y="270" width="426" height="100" rx="16" fill="white" stroke="#cbd5e1"/><rect x="572" y="270" width="426" height="6" rx="3" fill="#0f766e"/><text x="594" y="310" font-size="23" fill="#0f172a" font-weight="600">Sinartrosis</text><text x="594" y="347" font-size="18" fill="#334155" font-weight="400">Movilidad nula o casi nula.</text><rect x="572" y="385" width="426" height="100" rx="16" fill="white" stroke="#cbd5e1"/><rect x="572" y="385" width="426" height="6" rx="3" fill="#0f766e"/><text x="594" y="425" font-size="23" fill="#0f172a" font-weight="600">Anfiartrosis</text><text x="594" y="462" font-size="18" fill="#334155" font-weight="400">Movilidad limitada.</text><rect x="572" y="500" width="426" height="100" rx="16" fill="white" stroke="#cbd5e1"/><rect x="572" y="500" width="426" height="6" rx="3" fill="#0f766e"/><text x="594" y="540" font-size="23" fill="#0f172a" font-weight="600">Diartrosis</text><text x="594" y="577" font-size="18" fill="#334155" font-weight="400">Articulación libremente móvil.</text><rect x="40" y="650" width="980" height="125" rx="16" fill="#0f172a"/><text x="62" y="688" font-size="19" fill="#5eead4" font-weight="600">EJEMPLO · SINDESMOSIS TIBIOPERONEA DISTAL</text><text x="62" y="728" font-size="21" fill="white" font-weight="400">Estructura: fibrosa   |   Función: anfiartrosis (movilidad limitada)</text><text x="40" y="816" font-size="17" fill="#334155" font-weight="400">Son dos criterios distintos: no existe una correspondencia uno a uno entre todas las categorías.</text></g></svg>