<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="805" viewBox="0 0 1060 805" role="img" aria-labelledby="title desc"><title id="title">De la anatomía al diseño de asistencia</title><desc id="desc">Una ruta de preguntas para comenzar el análisis de un dispositivo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="1060" height="805" fill="#f8fafc"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="15" fill="#0f766e" font-weight="600">BIOMECATRÓNICA / CLASE 01</text><text x="40" y="94" font-size="30" fill="#0f172a" font-weight="600">De la anatomía al diseño de asistencia</text><text x="40" y="130" font-size="18" fill="#334155" font-weight="400">Una ruta de preguntas para comenzar el análisis de un dispositivo.</text><rect x="40" y="175" width="300" height="130" rx="16" fill="white" stroke="#cbd5e1"/><rect x="40" y="175" width="300" height="6" rx="3" fill="#0f766e"/><text x="62" y="215" font-size="23" fill="#0f172a" font-weight="600">Huesos</text><text x="62" y="252" font-size="18" fill="#334155" font-weight="400">Geometría y soporte</text><rect x="380" y="175" width="300" height="130" rx="16" fill="white" stroke="#cbd5e1"/><rect x="380" y="175" width="300" height="6" rx="3" fill="#0f766e"/><text x="402" y="215" font-size="23" fill="#0f172a" font-weight="600">Articulaciones</text><text x="402" y="252" font-size="18" fill="#334155" font-weight="400">Movilidad y restricciones</text><rect x="720" y="175" width="300" height="130" rx="16" fill="white" stroke="#cbd5e1"/><rect x="720" y="175" width="300" height="6" rx="3" fill="#0f766e"/><text x="742" y="215" font-size="23" fill="#0f172a" font-weight="600">Músculos</text><text x="742" y="252" font-size="18" fill="#334155" font-weight="400">Generación de fuerza</text><path d="M190 305 V335 H870 V305 M530 305 V335" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M530 335 L530 370" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="260" y="375" width="540" height="135" rx="16" fill="white" stroke="#cbd5e1"/><rect x="260" y="375" width="540" height="6" rx="3" fill="#0f766e"/><text x="282" y="415" font-size="23" fill="#0f172a" font-weight="600">Analizar el movimiento</text><text x="282" y="452" font-size="18" fill="#334155" font-weight="400">Relacionar estructura, función y tarea.</text><text x="282" y="479" font-size="18" fill="#334155" font-weight="400">Definir qué se quiere asistir.</text><path d="M530 510 V540 M190 540 H870" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M190 540 L190 575" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M530 540 L530 575" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M870 540 L870 575" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="580" width="300" height="140" rx="16" fill="white" stroke="#cbd5e1"/><rect x="40" y="580" width="300" height="6" rx="3" fill="#2563eb"/><text x="62" y="620" font-size="23" fill="#0f172a" font-weight="600">Mecanismo</text><text x="62" y="657" font-size="18" fill="#334155" font-weight="400">¿Qué movimiento y rango</text><text x="62" y="684" font-size="18" fill="#334155" font-weight="400">debe permitir?</text><rect x="380" y="580" width="300" height="140" rx="16" fill="white" stroke="#cbd5e1"/><rect x="380" y="580" width="300" height="6" rx="3" fill="#2563eb"/><text x="402" y="620" font-size="23" fill="#0f172a" font-weight="600">Actuación</text><text x="402" y="657" font-size="18" fill="#334155" font-weight="400">¿Qué fuerza o asistencia</text><text x="402" y="684" font-size="18" fill="#334155" font-weight="400">debe aportar?</text><rect x="720" y="580" width="300" height="140" rx="16" fill="white" stroke="#cbd5e1"/><rect x="720" y="580" width="300" height="6" rx="3" fill="#2563eb"/><text x="742" y="620" font-size="23" fill="#0f172a" font-weight="600">Sensado y control</text><text x="742" y="657" font-size="18" fill="#334155" font-weight="400">¿Qué medir y cómo</text><text x="742" y="684" font-size="18" fill="#334155" font-weight="400">ajustar la respuesta?</text><text x="40" y="765" font-size="17" fill="#334155" font-weight="400">Síntesis didáctica: las flechas indican una secuencia de análisis, no equivalencias anatómicas.</text></g></svg>